name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and test on macOS — the only supported platform family. JLISwift is
  # Apple-only (Accelerate-backed DSP, no cross-platform fallbacks).
  macos:
    name: macOS (Xcode 26)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      # Medical verification-evidence gate (WS-M1). Runs the safety-critical
      # suites on their own, un-parallelized, so the CONFORMANCE / MANIFEST
      # records print to the CI log as an archived, quotable evidence trail —
      # bit-exact lossless + cross-validation + near-lossless bound + signed
      # handling + encapsulation (Conformance), the frozen content-addressed
      # corpus with its drift guard (RegressionCorpus), the ISO/IEC 10918-2
      # Annex A IDCT accuracy (IDCTConformance), and fail-safe-on-malformed
      # for both the JPEG and DICOM parsers (Fuzz). A hard gate: no `|| true`.
      - name: Medical conformance evidence
        run: |
          swift test --no-parallel \
            --filter ConformanceEvidenceTests \
            --filter RegressionCorpusTests \
            --filter IDCTConformanceTests \
            --filter DICOMFuzzTests \
            --filter FuzzTests \
            --filter MedicalSafetyTests \
            --filter DICOMWriterTests 2>&1 | tee medical-evidence.log
          echo "::group::Conformance evidence record"
          grep -E 'CONFORMANCE|MANIFEST|IDCT-CONFORMANCE' medical-evidence.log || true
          echo "::endgroup::"

      - name: Upload medical evidence log
        uses: actions/upload-artifact@v4
        with:
          name: medical-evidence-log
          path: medical-evidence.log
        if: always()

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          xcrun llvm-cov export \
            .build/debug/JLISwiftPackageTests.xctest/Contents/MacOS/JLISwiftPackageTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            -format=lcov > coverage.lcov || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false
        continue-on-error: true

  # iOS/tvOS/watchOS/visionOS build check (no tests, just compilation).
  # Generic simulator destinations compile without needing a specific booted
  # device, so they stay valid as Xcode's bundled simulators change.
  platforms:
    name: ${{ matrix.platform }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
        include:
          - platform: iOS
            destination: 'generic/platform=iOS Simulator'
          - platform: tvOS
            destination: 'generic/platform=tvOS Simulator'
          - platform: watchOS
            destination: 'generic/platform=watchOS Simulator'
          - platform: visionOS
            destination: 'generic/platform=visionOS Simulator'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme JLISwift \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
