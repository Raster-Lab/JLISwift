name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and test on macOS — the only supported platform family. JLISwift is
  # Apple-only (Accelerate-backed DSP, no cross-platform fallbacks).
  macos:
    name: macOS (Xcode 26)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          xcrun llvm-cov export \
            .build/debug/JLISwiftPackageTests.xctest/Contents/MacOS/JLISwiftPackageTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            -format=lcov > coverage.lcov || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false
        continue-on-error: true

  # iOS/tvOS/watchOS/visionOS build check (no tests, just compilation).
  # Generic simulator destinations compile without needing a specific booted
  # device, so they stay valid as Xcode's bundled simulators change.
  platforms:
    name: ${{ matrix.platform }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
        include:
          - platform: iOS
            destination: 'generic/platform=iOS Simulator'
          - platform: tvOS
            destination: 'generic/platform=tvOS Simulator'
          - platform: watchOS
            destination: 'generic/platform=watchOS Simulator'
          - platform: visionOS
            destination: 'generic/platform=visionOS Simulator'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme JLISwift \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
